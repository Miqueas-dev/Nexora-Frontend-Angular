<div class="login-page">
  <div class="login-card">
    <div class="login-brand">
      <div class="login-mark">N</div>
      <div>
        <h1>Nexora</h1>
        <p>Back Office</p>
      </div>
    </div>

    <div class="mb-4">
      <h2>Iniciar sesión</h2>
      <p class="text-muted mb-0">Ingrese sus credenciales para acceder al sistema.</p>
    </div>

    <div class="mb-3">
      <label class="form-label">Correo</label>
      <input class="form-control form-control-lg" type="email" [(ngModel)]="correo" placeholder="usuario@nexora.com">
    </div>

    <div class="mb-4">
      <label class="form-label">Contraseña</label>
      <input class="form-control form-control-lg" type="password" [(ngModel)]="clave" (keyup.enter)="ingresar()">
    </div>

    <button class="btn btn-nexora btn-lg w-100" type="button" (click)="ingresar()" [disabled]="cargando">
      @if (cargando) { Ingresando... } @else { Ingresar }
    </button>
  </div>
</div>

@if (mensaje) {
  <div class="toast-container position-fixed top-0 end-0 p-3">
    <div class="toast show text-bg-danger border-0" role="alert">
      <div class="d-flex">
        <div class="toast-body">{{ mensaje }}</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" (click)="mensaje = ''"></button>
      </div>
    </div>
  </div>
}
