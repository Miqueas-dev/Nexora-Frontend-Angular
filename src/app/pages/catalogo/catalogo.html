<div class="mb-4"><h2 class="page-title">Catálogo</h2><p class="page-subtitle">Productos disponibles en Nexora.</p></div>
<div class="card nexora-card mb-4"><div class="card-body"><div class="row g-2"><div class="col-md-9"><input class="form-control" placeholder="Buscar producto" [(ngModel)]="texto" (keyup.enter)="buscar()"></div><div class="col-md-3"><button class="btn btn-nexora w-100" (click)="buscar()">Buscar</button></div></div></div></div>
<div class="row g-4">@for(producto of productos; track producto.idProducto){<div class="col-md-6 col-xl-4"><div class="card nexora-card h-100"><div class="card-body"><div class="d-flex justify-content-between"><span class="badge badge-role">{{producto.marca.marcaDesc}}</span><span class="badge" [class.text-bg-success]="producto.stockProducto>0" [class.text-bg-secondary]="producto.stockProducto===0">{{producto.stockProducto>0 ? 'Disponible' : 'Sin stock'}}</span></div><h5 class="mt-3">{{producto.descripProducto}}</h5><div class="fs-4 fw-bold text-success mt-3">S/ {{producto.precioProducto | number:'1.2-2'}}</div><div class="text-muted small">Stock: {{producto.stockProducto}}</div></div></div></div>}</div>
